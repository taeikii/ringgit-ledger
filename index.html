:root{
  color-scheme:dark;
  --bg:#000;--panel:#070707;--line:#1b1b1b;--line2:#282828;
  --ink:#fff;--mute:#8a8a8a;--dim:#5e5e5e;
  --acc:#4d9bff;--acc-soft:rgba(77,155,255,.13);
  --sans:'Silkscreen',system-ui,sans-serif;
  --mono:'Silkscreen',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.mark{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;color:#fff;font:600 11px/1 var(--mono);letter-spacing:.2em;cursor:pointer}
.mark i{width:11px;height:11px;background:var(--acc);display:block;border-radius:2px;box-shadow:0 0 14px rgba(77,155,255,.55);flex:none}
.nav{display:flex;gap:6px;align-items:center}
.nav button{width:30px;height:30px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;color:#b9b9b9;font:400 13px var(--mono);display:grid;place-items:center;cursor:pointer;padding:0}
.nav button:active{background:#141414}
.nav b{font:500 11px var(--mono);letter-spacing:.12em;color:#e9e9e9;min-width:74px;text-align:center;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{font:500 10px var(--mono);letter-spacing:.16em;color:var(--mute);background:none;border:1px solid transparent;border-radius:6px;padding:8px 12px;cursor:pointer}
.tabs button.on{color:var(--acc);border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 18px rgba(77,155,255,.15)}

<main>
  <header>
    <button class="mark" id="logo" aria-label="Ringgit Ledger, home"><i></i>RINGGIT LEDGER</button>
    <div class="nav" id="nav"><button id="prev" aria-label="Previous month">‹</button><b id="mlabel"></b><button id="next" aria-label="Next month">›</button></div>
  </header>
  <div class="tabs" id="tabs" role="tablist">
    <button data-v="home" role="tab">OVERVIEW</button>
    <button data-v="hist" role="tab">HISTORY</button>
    <button data-v="set" role="tab">SETTINGS</button>
  </div>
  <div id="app"></div>
</main>
<div id="toastwrap" aria-live="polite" aria-atomic="true"></div>
<script>
(function(){
'use strict';
const KEY='ringgit-ledger-v1',B={n:'Needs',w:'Wants'};
const pad=n=>String(n).padStart(2,'0');
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const keyOf=(y,m)=>y+'-'+pad(m+1);
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sen=v=>Math.round((+v||0)*100);
const rmS=s=>{const n=Math.round(+s||0);return (n<0?'\u2212':'')+'RM '+(Math.abs(n)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasOwn=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const PRESETS=[['Mamak','n'],['Grab','n'],['TnG reload','n'],['Shopee','w'],['PTPTN','n'],['Phone bill','n'],['Subscriptions','w'],['Laundry','n'],['Parking','n'],['Gifts','w']];

function fresh(){
 return {v:2,income:{},defInc:0,aside:0,goal:0,split:[60,40],
  cats:[{name:'Food',b:'n'},{name:'Transport',b:'n'},{name:'Groceries',b:'n'},{name:'Bills',b:'n'},{name:'Eating out',b:'w'},{name:'Shopping',b:'w'},{name:'Entertainment',b:'w'}],
  fixed:[],posted:{},tx:[],lastCat:null};
}
let S=fresh();
function norm(){
 S.v=2;
 if(!Array.isArray(S.split)||S.split.length!==2)S.split=[60,40];
 ['aside','goal','defInc'].forEach(k=>{S[k]=+S[k]||0});
 if(!S.income||typeof S.income!=='object'||Array.isArray(S.income))S.income={};
 if(!S.posted||typeof S.posted!=='object'||Array.isArray(S.posted))S.posted={};
 if(!Array.isArray(S.fixed))S.fixed=[];
 if(!Array.isArray(S.tx))S.tx=[];
 if(!Array.isArray(S.cats)||!S.cats.length)S.cats=fresh().cats;
 S.cats=S.cats.filter(c=>c&&typeof c.name==='string'&&c.name.trim()).map(c=>({name:c.name,b:c.b==='n'?'n':'w'}));
 S.tx=S.tx.filter(t=>t&&typeof t.date==='string'&&isFinite(t.amt)).map(t=>{
  const o={id:String(t.id||uid()),amt:Math.round((+t.amt||0)*100)/100,cat:String(t.cat||''),date:t.date.slice(0,10),note:String(t.note||''),bulk:!!t.bulk};
  if(t.fixedId)o.fixedId=String(t.fixedId);
  return o;
 }).sort((a,b)=>a.date.localeCompare(b.date));
 S.fixed=S.fixed.filter(f=>f&&f.name&&isFinite(f.amt)).map(f=>({id:String(f.id||uid()),name:String(f.name),amt:Math.round(Math.abs(+f.amt||0)*100)/100,day:Math.min(31,Math.max(1,Math.round(+f.day||1))),cat:String(f.cat||'')}));
 S.lastCat=typeof S.lastCat==='string'?S.lastCat:null;
}
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const now=new Date();
let Y=now.getFullYear(),M=now.getMonth(),view='home',dir=0,first=true;
let openW={},openS={income:true},bkt='n';
let sheetOpen=false,editId=null,sheetDate=null,formBulk=false;
let selCat=(S.cats.find(c=>c.name===S.lastCat)||S.cats[0]||{name:''}).name;
let q='',fcat='';
let toastTimer=null;

const ym=()=>keyOf(Y,M);
const monthLabel=()=>new Date(Y,M,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const bucketOf=cat=>(S.cats.find(x=>x.name===cat)||{b:'w'}).b;

function calc(){
 const key=ym(),hat=hasOwn(S.income,key);
 const inc=hat?(+S.income[key]||0):(+S.defInc||0);
 const budget=Math.max(sen(inc)-sen(S.aside),0);
 const bud={n:Math.round(budget*S.split[0]/100),w:Math.round(budget*S.split[1]/100)};
 const tx=S.tx.filter(t=>t.date.slice(0,7)===key).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
 const dim=daysIn(Y,M),curKey=keyOf(now.getFullYear(),now.getMonth());
 const isCur=key===curKey,isPast=key<curKey;
 const day=isCur?now.getDate():dim;
 const dnum=t=>+t.date.slice(8);
 const sum=arr=>arr.reduce((s,t)=>s+sen(t.amt),0);
 const pick=(a,b,f)=>sum(tx.filter(t=>{const d=dnum(t);return d>=a&&d<=b&&f(t)}));
 const spent=(a,b,k)=>pick(a,b,t=>!k||bucketOf(t.cat)===k);
 const daily=(a,b)=>pick(a,b,t=>!t.bulk);
 const bulkSum=(a,b)=>pick(a,b,t=>t.bulk);
 const total=sum(tx),bulkAll=bulkSum(1,dim);
 const left=isCur?Math.max(dim-day+1,0):0;
 const before=spent(1,day-1);
 const bulkRest=isCur?bulkSum(day,dim):0;
 const allow=left>0?(budget-before-bulkRest)/left:0;
 const dow=(new Date(Y,M,Math.min(day,dim)).getDay()+6)%7;
 const ws=Math.max(1,day-dow),we=Math.min(dim,day+6-dow);
 return {key,hasIncome:hat,inc,budget,bud,tx,dim,isCur,isPast,day,left,allow,today:daily(day,day),
  before,total,bulkAll,spent,daily,bulkSum,ws,we,
  weekSpent:daily(ws,we),weekLimit:Math.max(Math.round((budget-bulkAll)/dim*(we-ws+1)),0),
  monthLeft:budget-total,pace:Math.round(budget*day/dim)-total};
}

function projected(ds,amtSen){
 const key=ds.slice(0,7);
 const hat=hasOwn(S.income,key);
 const inc=hat?(+S.income[key]||0):(+S.defInc||0);
 const budget=Math.max(sen(inc)-sen(S.aside),0);
 const dim=daysIn(+key.slice(0,4),+key.slice(5,7)-1);
 const dn=+ds.slice(8);
 const left=Math.max(dim-dn+1,1);
 const tx=S.tx.filter(t=>t.date.slice(0,7)===key&&t.id!==editId);
 const sum=arr=>arr.reduce((s,t)=>s+sen(t.amt),0);
 const before=sum(tx.filter(t=>+t.date.slice(8)<dn));
 const bulkRest=sum(tx.filter(t=>+t.date.slice(8)>=dn&&t.bulk));
 return {per:(budget-before-bulkRest-amtSen)/left,left};
}

function allowOn(D,extra){
 const dim=daysIn(Y,M);
 if(!(D>=1)||D>dim)return null;
 const key=ym();
 const hat=hasOwn(S.income,key);
 const inc=hat?(+S.income[key]||0):(+S.defInc||0);
 const budget=Math.max(sen(inc)-sen(S.aside),0);
 let before=0,bulkFrom=0;
 S.tx.forEach(t=>{
  if(t.date.slice(0,7)!==key||t.id===editId)return;
  const d=+t.date.slice(8);
  if(d<D)before+=sen(t.amt);
  else if(t.bulk)bulkFrom+=sen(t.amt);
 });
 if(extra){
  const ed=+extra.date.slice(8);
  if(ed<D)before+=extra.sen;
  else if(extra.bulk)bulkFrom+=extra.sen;
 }
 return (budget-before-bulkFrom)/(dim-D+1);
}

function tomorrowWith(ds,amtSen,isBulk){
 if(ym()!==keyOf(now.getFullYear(),now.getMonth()))return null;
 const D=now.getDate()+1;
 const ed=+ds.slice(8);
 if(ed!==now.getDate()&&ed!==D)return null;
 return allowOn(D,{date:ds,sen:amtSen,bulk:isBulk});
}

function txRow(t,withDate){
 const b=bucketOf(t.cat);
 const d=withDate?`<span class="txd">${new Date(t.date+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span> \u00b7 `:'';
 return `<div class="tx" data-a="edit" data-id="${esc(t.id)}" role="button" tabindex="0" aria-label="Edit ${esc(t.cat)} ${rmS(sen(t.amt))}">
  <span class="txl">${d}<span class="cat">${esc(t.cat)}</span>${t.note?' \u00b7 '+esc(t.note):''}</span>
  <span class="txr">${t.bulk?'<span class="bulk">BULK</span>':''}${rmS(sen(t.amt))}<button class="x" data-a="del" data-id="${esc(t.id)}" aria-label="Delete entry">\u2715</button></span></div>`;
}

function tmHTML(c){
 const tm=allowOn(c.day+1);
 if(tm===null)return `<div class="leader"><span>Tomorrow</span><i></i><b>new month</b></div>`;
 const over=tm<=0;
 return `<div class="leader ${over?'over':''}"><span>Tomorrow</span><i></i><b style="${over?'color:#fff':''}">${rmS(Math.max(tm,0))}</b></div>`;
}

function heroHTML(c){
 if(c.isPast){
  const q=c.budget>0?c.total/c.budget:0;
  return `<section class="panel hero ${c.total>c.budget?'over':''}">
   <div class="row"><span class="label">Spent in ${monthLabel()}</span><span class="chip">CLOSED</span></div>
   <div class="big">${rmS(c.total)}</div>
   <div class="bar ${q>1?'over':''}"><i style="width:${Math.min(Math.max(1-q,0)*100,100)}%"></i></div>
   <div class="kv"><span>OF ${rmS(c.budget)} BUDGET</span><span>${c.budget?Math.round(q*100):0}% USED</span></div></section>`;
 }
 if(!c.isCur){
  const per=c.dim?Math.round(c.budget/c.dim):0;
  return `<section class="panel hero">
   <div class="row"><span class="label">Daily allowance</span><span class="chip">${monthLabel()}</span></div>
   <div class="big">${rmS(per)}</div>
   <div class="kv"><span>BUDGET ${rmS(c.budget)}</span><span>${c.dim} DAYS</span></div></section>`;
 }
 const shown=Math.max(c.allow-c.today,0);
 const over=c.today>c.allow||(c.allow<=0&&c.today>0);
 const keep=c.allow>0?Math.max(c.allow-c.today,0)/c.allow:0;
 const pt=c.pace>=0?`${rmS(c.pace)} UNDER PACE`:`${rmS(-c.pace)} OVER PACE`;
 return `<section class="panel hero ${over?'over':''}">
  <div class="row"><span class="label">You can spend today</span><span class="chip">${c.left} DAY${c.left===1?'':'S'} LEFT</span></div>
  <div class="big" id="hero" data-to="${shown}">${rmS(shown)}</div>
  <div class="bar ${over?'over':''}"><i style="width:${Math.round(keep*100)}%"></i></div>
  <div class="kv"><span>SPENT ${rmS(c.today)} / ${rmS(Math.max(c.allow,0))}</span><span>DAY ${c.day}/${c.dim}</span></div>
  <div style="margin-top:14px"><span class="tag ${c.pace<0?'over':'quiet'}">${pt}</span></div>
  ${tmHTML(c)}</section>`;
}

function bannerHTML(c){
 const p=new Date(Y,M-1,1),pk=keyOf(p.getFullYear(),p.getMonth());
 const last=hasOwn(S.income,pk)?+S.income[pk]||0:0;
 return `<section class="panel hero">
  <div class="row"><span class="label">No budget set</span><span class="chip">${monthLabel()}</span></div>
  <div class="big" style="color:#fff;font-size:34px;margin:14px 0 6px">SET INCOME</div>
  <div class="kv" style="margin-top:0"><span>SPENT SO FAR ${rmS(c.total)}</span><span>NO DAILY LIMIT</span></div>
  <div class="srow" style="margin-top:16px"><input id="binc" type="number" inputmode="decimal" min="0" placeholder="Income (RM)" aria-label="Income for this month"><button class="cta" data-a="bincok" style="width:auto;padding:0 18px;height:44px;letter-spacing:.14em">SET</button></div>
  ${last>0?`<button class="ghost" data-a="buselast" style="margin-top:10px;width:100%">USE LAST MONTH \u00b7 ${rmS(sen(last))}</button>`:''}
 </section>`;
}

function cardHTML(title,sp,lim,span){
 const rem=Math.max(lim-sp,0),keep=lim>0?rem/lim:0;
 return `<section class="panel ${span?'span':''}"><div class="label">${title}</div>
  <div class="num2">${rmS(lim-sp)}</div>
  <div class="bar ${lim-sp<0?'over':''}"><i style="width:${Math.round(keep*100)}%"></i></div>
  <div class="sub"><span>SPENT ${rmS(sp)}</span><span>OF ${rmS(lim)}</span></div></section>`;
}

function allocHTML(c){
 return `<section class="panel"><div class="row" style="margin-bottom:6px"><span class="label">Allocation</span><span class="chip">${S.split[0]} / ${S.split[1]}</span></div>
  ${['n','w'].map((k,i)=>{
   const lim=c.bud[k],used=c.spent(1,c.dim,k),lef=lim-used,over=lef<0;
   const keep=lim>0?Math.max(lef,0)/lim:0;
   return `<div class="alloc">
    <div class="arow" data-a="bkt" data-b="${k}" role="button" tabindex="0">
      <i class="sq ${k==='w'?'w':''}"></i><span class="aname">${B[k]} ${S.split[i]}%</span>
      <span class="aval">${rmS(lef)}${over?'<span class="mini">OVER</span>':''}</span><span class="chev">\u203a</span>
    </div>
    <div class="bar ${over?'over':''}"><i style="width:${(keep*100).toFixed(1)}%"></i></div>
    <div class="sub"><span>SPENT ${rmS(used)}</span><span>OF ${rmS(lim)}</span></div>
   </div>`;
  }).join('')}</section>`;
}

function homeHTML(c){
 let h='';
 if(!c.hasIncome&&c.inc===0)h+=bannerHTML(c);
 else h+=heroHTML(c);
 if(c.isCur){
  h+=`<div class="duo">${cardHTML('Left this week',c.weekSpent,c.weekLimit)}${cardHTML('Left this month',c.total,c.budget)}</div>`;
 }
 h+=allocHTML(c);
 h+=`<button class="cta" data-a="add" style="margin-top:2px">+ Add expense</button>`;
 h+=`<div class="foot"><span>${S.tx.length} entries</span><span>v7</span></div>`;
 return h;
}

function recapHTML(c){
 const by={};c.tx.forEach(t=>{by[t.cat]=(by[t.cat]||0)+sen(t.amt)});
 const top=Object.keys(by).sort((a,b)=>by[b]-by[a])[0];
 const elapsed=c.isCur?c.day:c.dim;
 let ns=0;for(let d=1;d<=elapsed;d++){if(!c.tx.some(t=>+t.date.slice(8)===d))ns++}
 return `<section class="panel">
  <div class="row" style="margin-bottom:8px"><span class="label">${monthLabel()}</span><span class="chip">RECAP</span></div>
  <div class="stat"><span>Spent</span><b>${rmS(c.total)}</b></div>
  ${top?`<div class="stat"><span>Biggest</span><b>${esc(top)} \u00b7 ${rmS(by[top])}</b></div>`:''}
  <div class="stat"><span>No-spend days</span><b>${ns} / ${elapsed}</b></div>
  ${c.isCur?`<div class="stat"><span>This week</span><b>${rmS(c.weekSpent)}${c.weekLimit?` <span style="color:#6a6a6a">/ ${rmS(c.weekLimit)}</span>`:''}</b></div>`:''}
 </section>`;
}

function calHTML(c){
 const off=(new Date(Y,M,1).getDay()+6)%7;
 const base=c.dim?c.budget/c.dim:0;
 let cells='';
 for(let d=1;d<=c.dim;d++){
  const v=c.daily(d,d),fut=c.isCur?d>c.day:new Date(Y,M,d)>now,tod=c.isCur&&d===c.day;
  const q=base>0?Math.min(v/base,1.2):0;
  const bg=(v>0&&!fut&&!tod)?`background:rgba(77,155,255,${(0.08+q*0.34).toFixed(2)})`:'';
  cells+=`<div class="cd ${fut?'f':''} ${tod?'t':''}" data-a="day" data-d="${c.key}-${pad(d)}" role="button" tabindex="0" aria-label="Day ${d}${fut?', upcoming':v?', '+rmS(v)+' spent':', no spend'}" ${bg?`style="${bg}"`:''}><span>${d}</span></div>`;
 }
 return `<section class="panel">
  <div class="row" style="margin-bottom:12px"><span class="label">${c.isCur?'This month':'Calendar'}</span><span class="chip">TAP A DAY TO LOG</span></div>
  <div class="cal">${'MTWTFSS'.split('').map(l=>`<div class="wk">${l}</div>`).join('')}${Array.from({length:off},()=>'<div class="cd e"></div>').join('')}${cells}</div></section>`;
}

function weeksHTML(c){
 if(!c.tx.length)return '';
 let h='<section class="panel"><div class="row" style="margin-bottom:10px"><span class="label">Weeks</span><span class="chip">MON \u2192 SUN</span></div>',a=1,n=1;
 while(a<=c.dim){
  const dw=(new Date(Y,M,a).getDay()+6)%7,b=Math.min(a+6-dw,c.dim);
  const wt=c.tx.filter(t=>{const d=+t.date.slice(8);return d>=a&&d<=b});
  const isOpen=hasOwn(openW,'w'+n)?openW['w'+n]:(c.isCur&&c.day>=a&&c.day<=b);
  h+=`<details class="dt" data-k="w${n}" ${isOpen?'open':''}><summary><span>Week ${n} \u00b7 ${a}\u2013${b}</span><b>${rmS(wt.reduce((s,t)=>s+sen(t.amt),0))}</b></summary>`;
  for(let d=a;d<=b;d++){
   const dt=wt.filter(t=>+t.date.slice(8)===d);if(!dt.length)continue;
   h+=`<div class="day"><div><span>${d} ${new Date(Y,M,d).toLocaleDateString('en-GB',{weekday:'short'})}</span><span>${rmS(dt.reduce((s,t)=>s+sen(t.amt),0))}</span></div>${dt.map(t=>txRow(t)).join('')}</div>`;
  }
  h+='</details>';a=b+1;n++;
 }
 return h+'</section>';
}

function resultsHTML(){
 const term=q.trim().toLowerCase();
 const rows=S.tx.filter(t=>{
  if(fcat&&t.cat!==fcat)return false;
  if(!term)return true;
  return (t.cat+' '+t.note+' '+t.date).toLowerCase().includes(term);
 }).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
 return `<section class="panel"><div class="row" style="margin-bottom:6px"><span class="label">Results</span><span class="chip">${rows.length}</span></div>${rows.length?rows.map(t=>txRow(t,true)).join(''):'<div class="sub" style="margin-top:10px">NOTHING MATCHES</div>'}</section>`;
}

function histBody(c){
 if(q.trim()||fcat)return resultsHTML();
 return recapHTML(c)+calHTML(c)+weeksHTML(c);
}

function histHTML(c){

}

  <div class="srow" style="margin-top:10px"><input id="ncat" placeholder="New category" aria-label="New category name"><select id="nbk" aria-label="Bucket"><option value="n">NEEDS</option><option value="w">WANTS</option></select><button class="ghost" data-a="cadd">ADD</button></div>

  <button class="ghost" data-a="fadd" style="margin-top:8px;width:100%">ADD FIXED COST</button></details>`;
 h+=`<details class="sec" data-sk="goal" ${openS.goal?'open':''}><summary><span class="label">Savings target</span><span class="sum">${S.goal>0?rmS(sen(S.goal)):'OFF'}</span></summary>
  <div class="srow2"><span>Keep unspent</span><input id="goal" type="number" min="0" inputmode="decimal" value="${S.goal}" aria-label="Savings target"></div>

function sheetHTML(c){
 const t=editId?S.tx.find(x=>x.id===editId):null;
 const dv=sheetDate||(c.isCur?fmt(now):c.key+'-01');
 if(!S.cats.some(x=>x.name===selCat))selCat=(S.cats[0]||{name:''}).name;
 return `<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheettitle">
  <div class="row"><span class="label" id="sheettitle">${t?'Edit entry':'New expense'}</span><button class="x" data-a="cancel" aria-label="Close">\u2715</button></div>
  <input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${t?t.amt:''}" aria-label="Amount">
  <div class="chips">${S.cats.map((x,i)=>`<button class="chip2 ${x.name===selCat?'on':''}" data-a="chip" data-i="${i}" aria-pressed="${x.name===selCat}">${esc(x.name)}</button>`).join('')}</div>
  <div class="srow" style="margin-bottom:8px"><input id="date" type="date" value="${dv}" aria-label="Date"><input id="note" placeholder="Note" value="${t?esc(t.note):''}" aria-label="Note"></div>
  <div class="seg" role="group" aria-label="Entry type"><button data-a="type" data-t="daily" class="${formBulk?'':'on'}">Daily</button><button data-a="type" data-t="bulk" class="${formBulk?'on':''}">Bulk</button></div>
  <div class="whatif" id="whatif"></div>
  <button class="cta" data-a="save">${t?'Save changes':'Add expense'}</button>
  ${t?`<button class="del" data-a="deledit">Delete this entry</button>`:''}
 </div></div>`;

function render(){
 const c=calc();
 document.getElementById('mlabel').textContent=monthLabel().toUpperCase();
 document.getElementById('nav').style.display=view==='set'?'none':'flex';
 document.querySelectorAll('#tabs button').forEach(b=>{
  const active=b.dataset.v===view||(view==='bucket'&&b.dataset.v==='home');
  b.classList.toggle('on',active);b.setAttribute('aria-selected',active);
 });
 let h='';
 if(view==='home')h=homeHTML(c);
 else if(view==='hist')h=histHTML(c);
 else if(view==='bucket')h=bucketHTML(c);
 else h=setHTML(c);
 if(sheetOpen)h+=sheetHTML(c);
 const app=document.getElementById('app');
 app.innerHTML=h;
 app.className=dir>0?'inR':dir<0?'inL':'';
 dir=0;
 document.body.style.overflow=sheetOpen?'hidden':'';
 if(sheetOpen){
  updateWhatif();
  setTimeout(()=>{const a=document.getElementById('amt');if(a){a.focus();if(a.select)a.select()}},30);
 }else if(view==='home'&&first){
  const hero=document.getElementById('hero');
  if(hero&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
   const to=+hero.dataset.to,t0=performance.now();
   (function step(t){const p=Math.min((t-t0)/700,1);hero.textContent=rmS(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
  }
 }
 first=false;
}

function showToast(msg,label,fn){
 const w=document.getElementById('toastwrap');
 w.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${label?`<button id="tact">${esc(label)}</button>`:''}</div>`;
 if(label){
  const b=document.getElementById('tact');
  if(b)b.onclick=()=>{w.innerHTML='';clearTimeout(toastTimer);if(fn)fn()};
 }
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>{w.innerHTML=''},label?6000:2600);
}

function go(v,d){
 view=v;dir=d;sheetOpen=false;editId=null;sheetDate=null;
 window.scrollTo(0,0);render();
}
function shiftMonth(n){
 const d=new Date(Y,M+n,1);Y=d.getFullYear();M=d.getMonth();openW={};render();
}
function openAdd(date){
 sheetOpen=true;editId=null;formBulk=false;sheetDate=date||null;
 if(!S.cats.some(c=>c.name===selCat))selCat=(S.cats[0]||{name:''}).name;
 render();
}
function openEdit(id){
 const t=S.tx.find(x=>x.id===id);if(!t)return;
 sheetOpen=true;editId=id;formBulk=!!t.bulk;sheetDate=t.date;selCat=t.cat;
 render();
}
function closeSheet(){sheetOpen=false;editId=null;sheetDate=null;render()}

function saveSheet(){
 const aEl=document.getElementById('amt'),dEl=document.getElementById('date'),nEl=document.getElementById('note');
 const amt=parseFloat(aEl.value),date=dEl.value,note=nEl.value.trim();
 if(!(amt>0)||!date){
  if(!(amt>0)){aEl.focus();if(aEl.select)aEl.select()}
  return;
 }
 const o={amt:Math.round(amt*100)/100,cat:selCat,date,note,bulk:formBulk};
 let msg='Entry saved';
 if(editId){
  const t=S.tx.find(x=>x.id===editId);
  if(t){Object.assign(t,o);msg='Entry updated'}
 }else{
  S.tx.push(Object.assign({id:uid()},o));msg='Expense logged';
 }
 S.lastCat=selCat;
 save();
 const d=new Date(date+'T00:00');
 Y=d.getFullYear();M=d.getMonth();
 sheetOpen=false;editId=null;sheetDate=null;
 render();showToast(msg);
}

function delTx(id){
 const i=S.tx.findIndex(t=>t.id===id);
 if(i<0)return;
 const t=S.tx.splice(i,1)[0];
 save();render();
 showToast('Entry deleted','Undo',()=>{
  S.tx.splice(Math.min(i,S.tx.length),0,t);save();render();
 });
}

function postFixed(){
 const d=new Date(),k=keyOf(d.getFullYear(),d.getMonth());
 const dim=daysIn(d.getFullYear(),d.getMonth());
 const list=S.posted[k]||(S.posted[k]=[]);
 const added=[];
 S.fixed.forEach(f=>{
  if(list.indexOf(f.id)>=0)return;
  const dd=Math.min(f.day,dim);
  if(d.getDate()<dd)return;
  const date=k+'-'+pad(dd);
  if(S.tx.some(t=>t.fixedId===f.id&&t.date.slice(0,7)===k)){list.push(f.id);return}
  const cat=S.cats.some(c=>c.name===f.cat)?f.cat:((S.cats[0]||{name:''}).name);
  S.tx.push({id:uid(),amt:f.amt,cat,date,note:f.name,bulk:true,fixedId:f.id});
  list.push(f.id);added.push(f);
 });
 if(added.length){
  save();
  showToast(added.length===1?`${added[0].name} ${rmS(sen(added[0].amt))} logged`:`${added.length} fixed costs logged`);
 }
}

function updateWhatif(){
 const box=document.getElementById('whatif');
 if(!box)return;
 const aEl=document.getElementById('amt'),dEl=document.getElementById('date');
 const amt=parseFloat(aEl?aEl.value:'');
 const ds=(dEl&&dEl.value)||fmt(now);
 const parts=[];let bad=false;
 if(formBulk){
  parts.push('Bulk: left out of the daily number, spread across the month.');
 }else if(amt>0){
  const p=projected(ds,sen(amt));
  if(isFinite(p.per)){
   bad=p.per<0;
   parts.push(bad
    ?`More than what's left \u2014 ${rmS(-p.per)}/day over for ${p.left} day${p.left===1?'':'s'}.`
    :`Leaves ${rmS(p.per)}/day for ${p.left} day${p.left===1?'':'s'}.`);
  }
 }
 const tm=tomorrowWith(ds,amt>0?sen(amt):0,formBulk);
 if(tm===null&&ds.slice(0,7)===ym()&&+ds.slice(8)===now.getDate()&&now.getDate()===daysIn(now.getFullYear(),now.getMonth())){
  parts.push('Tomorrow starts a new month.');
 }else if(tm!==null){
  parts.push(`Tomorrow ${rmS(Math.max(tm,0))}.`);
  if(tm<0)bad=true;
 }
 box.textContent=parts.join(' ');
 box.className='whatif'+(bad?' bad':'');
}

function updateHistBody(){
 const hb=document.getElementById('hbody');
 if(hb)hb.innerHTML=histBody(calc());
}

function setIncomeNow(v){
 S.income[ym()]=Math.max(0,Math.round(v*100)/100);
 save();render();showToast('Income set for '+monthLabel());
}

function addFixed(){
 const n=(document.getElementById('fname').value||'').trim();
 const a=parseFloat(document.getElementById('famt').value);
 const day=+document.getElementById('fday').value||1;
 const cat=document.getElementById('fcat').value;
 if(!n||!(a>0)){showToast('Name and amount required');return}
 S.fixed.push({id:uid(),name:n,amt:Math.round(a*100)/100,day,cat});
 save();postFixed();render();showToast(`${n} \u00b7 day ${day}`);
}

function addCat(){
 const el=document.getElementById('ncat'),n=(el.value||'').trim(),b=document.getElementById('nbk').value;
 if(!n)return;
 if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase())){showToast('Category already exists');return}
 S.cats.push({name:n,b:b==='n'?'n':'w'});save();render();
}

function addPresets(){
 let n=0;
 PRESETS.forEach(([name,b])=>{
  if(!S.cats.some(c=>c.name.toLowerCase()===name.toLowerCase())){S.cats.push({name,b});n++}
 });
 if(n){save();render();showToast(n+' preset'+(n===1?'':'s')+' added')}
 else showToast('Presets already added');
}

function exportCSV(){
 const rows=[['date','category','bucket','amount','type','note']];
 S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
  rows.push([t.date,t.cat,B[bucketOf(t.cat)],(Math.round(t.amt*100)/100).toFixed(2),t.bulk?'bulk':'daily',t.note]);
 });
 const body=rows.map(r=>r.map(v=>{
  const s=String(v==null?'':v);
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
 }).join(',')).join('\r\n');
 try{
  const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ringgit-ledger-'+fmt(now)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  showToast('CSV exported');
 }catch(e){showToast('Export failed here')}
}

async function copyBackup(){
 const t=JSON.stringify(S),ta=document.getElementById('bk');
 ta.value=t;ta.focus();ta.select();
 let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}
 catch(e){try{ok=document.execCommand('copy')}catch(_){}}
 document.getElementById('bkmsg').textContent=ok?'Copied. Paste it somewhere safe.':'Could not copy — select the text and copy it.';
}

function restoreBackup(){
 const ta=document.getElementById('bk');
 try{
  const o=JSON.parse(ta.value);
  if(!o||!Array.isArray(o.tx)||!Array.isArray(o.cats))throw new Error('shape');
  S=Object.assign(fresh(),o);
  norm();save();sheetOpen=false;render();
  showToast('Backup restored');
 }catch(e){
  document.getElementById('bkmsg').textContent='Not a valid backup. Paste the full text.';
 }
}

function onAppClick(e){
 const el=e.target.closest('[data-a]');
 if(!el)return;
 const a=el.dataset.a;
 if(a==='chip'){
  const i=+el.dataset.i;
  if(!S.cats[i])return;
  selCat=S.cats[i].name;
  document.querySelectorAll('.chip2').forEach(c=>{
   const on=c.dataset.i===String(i);
   c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);
  });
  return;
 }
 if(a==='type'){
  formBulk=el.dataset.t==='bulk';
  document.querySelectorAll('.seg [data-a="type"]').forEach(b=>b.classList.toggle('on',(b.dataset.t==='bulk')===formBulk));
  updateWhatif();return;
 }
 if(a==='edit'){openEdit(el.dataset.id);return}
 if(a==='del'){delTx(el.dataset.id);return}
 if(a==='deledit'){const id=editId;sheetOpen=false;editId=null;if(id)delTx(id);return}
 if(a==='bkt'){bkt=el.dataset.b;go('bucket',1);return}
 if(a==='bback'){go('home',-1);return}
 if(a==='day'){openAdd(el.dataset.d);return}
 if(a==='add'){openAdd(null);return}
 if(a==='save'){saveSheet();return}
 if(a==='cancel'){closeSheet();return}
 if(a==='back'){go('home',-1);return}
 if(a==='mprev'){shiftMonth(-1);return}
 if(a==='mnext'){shiftMonth(1);return}
 if(a==='fadd'){addFixed();return}
 if(a==='fdel'){
  S.fixed=S.fixed.filter(f=>f.id!==el.dataset.id);save();render();showToast('Fixed cost removed');return;
 }
 if(a==='cadd'){addCat();return}
 if(a==='cdel'){
  const i=+el.dataset.i,cat=S.cats[i];
  if(!cat)return;
  if(S.cats.length<=1){showToast('Keep at least one category');return}
  const used=S.tx.filter(t=>t.cat===cat.name).length;
  if(used>0){showToast(`${cat.name} has ${used} entries \u2014 remove those first`);return}
  S.cats.splice(i,1);save();render();return;
 }
 if(a==='presets'){addPresets();return}
 if(a==='csv'){exportCSV();return}
 if(a==='cpy'){copyBackup();return}
 if(a==='rst'){restoreBackup();return}
 if(a==='bincok'){
  const v=parseFloat(document.getElementById('binc').value);
  if(!(v>0)){showToast('Enter the income first');return}
  setIncomeNow(v);return;
 }
 if(a==='buselast'){
  const p=new Date(Y,M-1,1),pk=keyOf(p.getFullYear(),p.getMonth());
  if(hasOwn(S.income,pk))setIncomeNow(+S.income[pk]||0);
  return;
 }
}

function onAppChange(e){
 const t=e.target;
 if(t.id==='date'){sheetDate=t.value;updateWhatif();return}
 if(t.id==='inc'){
  const v=t.value.trim();
  if(v==='')delete S.income[ym()];
  else S.income[ym()]=Math.max(0,Math.round((parseFloat(v)||0)*100)/100);
  save();render();return;
 }
 if(t.id==='definc'){S.defInc=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.id==='aside'){S.aside=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.id==='goal'){S.goal=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.id==='fcatf'){fcat=t.value;updateHistBody();return}
 if(t.id==='fcat'||t.id==='fday'||t.id==='nbk')return;
 if(t.dataset.split!==undefined){S.split[+t.dataset.split]=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.dataset.cb!==undefined){S.cats[+t.dataset.cb].b=t.value==='n'?'n':'w';save();render();return}
}

const app=document.getElementById('app');
app.addEventListener('click',onAppClick);
app.addEventListener('change',onAppChange);
app.addEventListener('input',e=>{
 if(e.target.id==='q'){q=e.target.value;updateHistBody()}
 else if(e.target.id==='amt'){updateWhatif()}
});
app.addEventListener('toggle',e=>{
 const d=e.target;
 if(!d||d.tagName!=='DETAILS')return;
 if(d.dataset.k)openW[d.dataset.k]=d.open;
 else if(d.dataset.sk)openS[d.dataset.sk]=d.open;
},true);

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&sheetOpen){e.preventDefault();closeSheet()}
});
document.getElementById('logo').onclick=()=>go('home',-1);
document.getElementById('prev').onclick=()=>shiftMonth(-1);
document.getElementById('next').onclick=()=>shiftMonth(1);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v,b.dataset.v==='home'?-1:1));

let tx0=0,ty0=0,tOk=true;
document.addEventListener('touchstart',e=>{
 const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;
 tOk=!e.target.closest('input,textarea,select');
},{passive:true});
document.addEventListener('touchend',e=>{
 if(sheetOpen||!tOk)return;
 const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;
 if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
 if(view==='home'&&dx<0)go('hist',1);
 else if((view==='hist'||view==='bucket')&&dx>0)go('home',-1);
},{passive:true});

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
postFixed();
render();
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
})();
</script></body></html>
