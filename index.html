:root{
  color-scheme:dark;
  --bg:#050505;--panel:#0a0a0a;--line:#1e1e1e;--line2:#2b2b2b;
  --ink:#ededed;--mute:#a8a8a8;--dim:#828282;
  --acc:#4d9bff;--acc-soft:rgba(77,155,255,.13);--good:#4ade80;--warn:#f5c542;--bad:#ff5a5a;
  --sans:'Silkscreen',system-ui,sans-serif;
  --mono:'Silkscreen',ui-monospace,monospace;
  --ui:'IBM Plex Mono',ui-monospace,'Cascadia Mono',monospace;
}
*{box-sizing:border-box}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.mark{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;color:#fff;font:600 11px/1 var(--ui);letter-spacing:.2em;cursor:pointer;white-space:nowrap}
.mark i{width:11px;height:11px;background:var(--acc);display:block;border-radius:2px;box-shadow:0 0 14px rgba(77,155,255,.55);flex:none}
.nav{display:flex;gap:6px;align-items:center}
.nav button{width:30px;height:30px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;color:#b9b9b9;font:400 13px var(--ui);display:grid;place-items:center;cursor:pointer;padding:0}
.nav button:active{background:#141414}
.nav b{font:500 11px var(--ui);letter-spacing:.12em;color:#e9e9e9;min-width:74px;text-align:center;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{font:500 10px var(--ui);letter-spacing:.16em;color:var(--mute);background:none;border:1px solid transparent;border-radius:6px;padding:8px 12px;cursor:pointer}
.tabs button.on{color:var(--acc);border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 18px rgba(77,155,255,.15)}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:18px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.label{font:400 10px var(--ui);letter-spacing:.07em;color:var(--mute);text-transform:uppercase}
.chip{font:500 10px var(--ui);letter-spacing:.1em;color:#b4b4b4;border:1px solid var(--line2);padding:4px 8px;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.big{font:400 clamp(36px,12.4vw,62px)/1.08 var(--mono);letter-spacing:0;color:var(--acc);margin:16px 0 18px;text-shadow:0 0 34px rgba(77,155,255,.3);overflow-wrap:anywhere}
.hero.over .big{color:var(--bad);text-shadow:none}
.bar{height:6px;background:#151515;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.over i{background:var(--bad)}
.kv{display:flex;justify-content:space-between;font:400 10px var(--ui);letter-spacing:.06em;color:#a6a6a6;margin-top:8px;text-transform:uppercase}
.tag{display:inline-block;font:700 10px var(--ui);letter-spacing:.12em;padding:5px 8px;border-radius:3px;text-transform:uppercase}
.tag.over{background:#fff;color:#000}
.tag.quiet{border:1px solid var(--line2);color:var(--mute)}
.tmrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font:400 10px var(--ui);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.tmrow b{font:400 12px var(--ui);color:#fff;letter-spacing:.02em}
.tmrow.over b{color:#fff}
.leader{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed #232323;font:400 11px var(--ui);letter-spacing:.08em;color:#9d9d9d;text-transform:uppercase}
.leader i{flex:1;border-bottom:1px dotted #333;transform:translateY(-3px)}
.leader b{color:#fff;font-weight:500;letter-spacing:.04em}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.duo>*{min-width:0}
.duo .panel{margin:0;padding:15px}
.num2.over{color:#fff}
.miniTag{font:400 8px var(--ui);letter-spacing:.12em;padding:3px 5px;border-radius:2px;border:1px solid var(--line2);color:var(--mute)}
.miniTag.under{border-color:rgba(74,222,128,.45);color:var(--good)}
.miniTag.warn{background:rgba(245,197,66,.10);color:var(--warn);border-color:rgba(245,197,66,.42)}
.miniTag.over{background:rgba(255,90,90,.12);color:var(--bad);border-color:rgba(255,90,90,.45)}
.num2{font:500 clamp(18px,5vw,25px)/1.1 var(--mono);letter-spacing:-.02em;margin:11px 0 12px;overflow-wrap:anywhere}
.sub{font:400 9px var(--ui);letter-spacing:.01em;color:#9a9a9a;margin-top:8px;display:flex;justify-content:space-between;gap:6px;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.alloc .arow{display:flex;align-items:center;gap:9px;padding:12px 0;cursor:pointer;border-radius:4px}
.alloc .arow:first-of-type{padding-top:4px}
.sq{width:7px;height:7px;border-radius:1px;background:var(--acc);flex:none}
.sq.w{background:#fff}
.aname{font:500 10px var(--ui);letter-spacing:.12em;color:#cfcfcf;flex:1;text-transform:uppercase}
.aval{font:500 12px var(--mono);color:#fff;white-space:nowrap}
.aval.neg{color:#fff}
.mini{font:700 8.5px var(--ui);letter-spacing:.1em;background:rgba(255,90,90,.14);color:var(--bad);padding:3px 5px;border-radius:2px;margin-left:6px;vertical-align:2px}
.chev{color:#4a4a4a;font-size:14px;line-height:1}
.alloc .bar{margin:0 0 0 16px}
.alloc .sub{margin:6px 0 16px 16px}
.wrow{padding:12px 0;border-bottom:1px solid #141414}
.wrow:last-of-type{border-bottom:0}
.wtop{display:flex;align-items:baseline;gap:8px}
.wname{flex:1;min-width:0;font:400 12px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:#e5e5e5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wprice{font:400 13px var(--mono);color:#fff;white-space:nowrap}
.wbar{height:5px;background:#151515;border-radius:2px;overflow:hidden;margin:8px 0 8px}
.wbar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.wsub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wbuy{background:none;border:1px solid var(--line2);color:#dcdcdc;border-radius:4px;padding:5px 10px;font:400 9px var(--ui);letter-spacing:.12em;cursor:pointer}
.wbuy:hover{border-color:var(--acc);color:var(--acc)}
.wadd{display:grid;grid-template-columns:1fr 78px auto;gap:6px;margin-top:14px}
.wadd input{padding:9px 10px;font-size:11px}
.fxadd button{background:var(--acc);color:#000;border:0;border-radius:4px;font-weight:700;cursor:pointer;font-size:9px;letter-spacing:.1em}
.wadd button{padding:0 12px;font-size:9px;letter-spacing:.1em;background:var(--acc);color:#000;border:0;border-radius:4px;font-weight:700;cursor:pointer}
.cardfoot{display:flex;justify-content:flex-end;margin-top:12px}
.plus{width:32px;height:32px;padding:0;display:grid;place-items:center;border:0;background:none;color:var(--acc);font:400 20px/1 var(--mono);cursor:pointer;margin:-8px -8px -8px 0}
.rowend{display:flex;align-items:center;gap:8px;min-width:0}
.plus:active{opacity:.55}
.bs{padding:6px 10px;font-size:9px;letter-spacing:.08em}
.linkbtn{background:none;border:0;color:var(--acc);font:400 9px var(--ui);letter-spacing:.12em;padding:14px 0 2px;cursor:pointer;text-transform:uppercase}
.sheetform{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.twosel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.datesm{width:auto;max-width:132px;padding:6px 8px;font-size:10px;border-radius:4px;letter-spacing:.04em}
.panel[data-a]{cursor:pointer}
.panel.t-good{background:rgba(74,222,128,.055);border-color:rgba(74,222,128,.28)}
.panel.t-warn{background:rgba(245,197,66,.06);border-color:rgba(245,197,66,.26)}
.panel.t-neutral{background:rgba(77,155,255,.05);border-color:rgba(77,155,255,.2)}
.panel.t-bad{background:rgba(255,90,90,.07);border-color:rgba(255,90,90,.30)}
.wlhead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.wlpill{display:inline-flex;align-items:center;gap:6px;background:#242424;color:#d2d2d2;font:500 10.5px var(--ui);letter-spacing:.02em;padding:4px 10px;border-radius:99px}
.wlpill i{width:4px;height:4px;background:#8a8a8a;border-radius:1px;display:block;flex:none}
.wlsum{margin-left:auto;font:400 10.5px var(--ui);color:#8f8f8f}
.wlsum b{font-weight:600;color:#ededed}
.wsub-r{display:flex;align-items:center;gap:12px}
.wrow.is-ready{background:rgba(74,222,128,.07);margin:0 -18px;padding:12px 18px;border-left:2px solid var(--good);border-bottom:0}
@media (max-width:400px){.wrow.is-ready{margin:0 -15px;padding-left:15px;padding-right:15px}}
.wempty{padding:16px 0 8px}
.wempty b{display:block;font:400 16px var(--ui);color:#bdbdbd}

  </div>
  <div id="app"></div>
</main>
<div id="toastwrap" aria-live="polite" aria-atomic="true"></div>
<script>
(function(){
'use strict';
const KEY='ringgit-ledger-v1',B={n:'Needs',w:'Wants'};
const pad=n=>String(n).padStart(2,'0');
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const keyOf=(y,m)=>y+'-'+pad(m+1);
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sen=v=>Math.round((+v||0)*100);
const rmS=s=>{const n=Math.round(+s||0);return (n<0?'\u2212':'')+'RM '+(Math.abs(n)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasOwn=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const PRESETS=[['Mamak','n'],['Grab','n'],['TnG reload','n'],['Shopee','w'],['PTPTN','n'],['Phone bill','n'],['Subscriptions','w'],['Laundry','n'],['Parking','n'],['Gifts','w']];

function fresh(){
 return {v:2,income:{},defInc:0,aside:0,goal:0,split:[60,40],
  cats:[{name:'Food',b:'n'},{name:'Transport',b:'n'},{name:'Groceries',b:'n'},{name:'Bills',b:'n'},{name:'Eating out',b:'w'},{name:'Shopping',b:'w'},{name:'Entertainment',b:'w'}],
  fixed:[],posted:{},tx:[],wish:[],lastCat:null};
}
let S=fresh();
function norm(){
 S.v=2;
 if(!Array.isArray(S.split)||S.split.length!==2)S.split=[60,40];
 ['aside','goal','defInc'].forEach(k=>{S[k]=+S[k]||0});
 if(!S.income||typeof S.income!=='object'||Array.isArray(S.income))S.income={};
 if(!S.posted||typeof S.posted!=='object'||Array.isArray(S.posted))S.posted={};
 if(!Array.isArray(S.fixed))S.fixed=[];
 if(!Array.isArray(S.wish))S.wish=[];
 S.wish=S.wish.filter(w=>w&&w.name).map(w=>({id:String(w.id||uid()),name:String(w.name),price:Math.round(Math.abs(+w.price||0)*100)/100,added:String(w.added||fmt(new Date())).slice(0,10),done:!!w.done,boughtOn:w.boughtOn?String(w.boughtOn).slice(0,10):null,txId:w.txId?String(w.txId):null}));
 if(!Array.isArray(S.tx))S.tx=[];
 if(!Array.isArray(S.cats)||!S.cats.length)S.cats=fresh().cats;
 S.cats=S.cats.filter(c=>c&&typeof c.name==='string'&&c.name.trim()).map(c=>({name:c.name,b:c.b==='n'?'n':'w'}));
 S.tx=S.tx.filter(t=>t&&typeof t.date==='string'&&isFinite(t.amt)).map(t=>{
  const catName=String(t.cat||'');
  const o={id:String(t.id||uid()),amt:Math.round((+t.amt||0)*100)/100,cat:catName,date:t.date.slice(0,10),note:String(t.note||''),bulk:!!t.bulk,b:(t.b==='n'||t.b==='w')?t.b:((S.cats.find(c=>c.name===catName)||{b:'w'}).b)};
  if(t.fixedId)o.fixedId=String(t.fixedId);
  return o;
 }).sort((a,b)=>a.date.localeCompare(b.date));
 S.fixed=S.fixed.filter(f=>f&&f.name&&isFinite(f.amt)).map(f=>({id:String(f.id||uid()),name:String(f.name),amt:Math.round(Math.abs(+f.amt||0)*100)/100,cat:String(f.cat||'')}));
 S.lastCat=typeof S.lastCat==='string'?S.lastCat:null;
}
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const now=new Date();
let Y=now.getFullYear(),M=now.getMonth(),view='home',dir=0,first=true;
let openW={},openS={income:true},bkt='n';
let sheetOpen=false,editId=null,sheetDate=null,formBulk=false,formBucket='n',prefill=null,formOpen=null,restoreOpen=false;
let selCat=(S.cats.find(c=>c.name===S.lastCat)||S.cats[0]||{name:''}).name;
let q='',fcat='';
let toastTimer=null;

const ym=()=>keyOf(Y,M);
const monthLabel=()=>new Date(Y,M,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const bucketOf=cat=>(S.cats.find(x=>x.name===cat)||{b:'w'}).b;

function calc(){
 const key=ym(),hat=hasOwn(S.income,key);
 const inc=hat?(+S.income[key]||0):(+S.defInc||0);
 const budget=Math.max(sen(inc)-sen(S.aside),0);
 const bud={n:Math.round(budget*S.split[0]/100),w:Math.round(budget*S.split[1]/100)};
 const tx=S.tx.filter(t=>t.date.slice(0,7)===key).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
 const dim=daysIn(Y,M),curKey=keyOf(now.getFullYear(),now.getMonth());
 const isCur=key===curKey,isPast=key<curKey;
 const day=isCur?now.getDate():dim;
 const dnum=t=>+t.date.slice(8);
 const sum=arr=>arr.reduce((s,t)=>s+sen(t.amt),0);
 const pick=(a,b,f)=>sum(tx.filter(t=>{const d=dnum(t);return d>=a&&d<=b&&f(t)}));
 const spent=(a,b,k)=>pick(a,b,t=>!k||t.b===k);
 const daily=(a,b)=>pick(a,b,t=>!t.bulk);
 const bulkSum=(a,b)=>pick(a,b,t=>t.bulk);
 const total=sum(tx),bulkAll=bulkSum(1,dim);
 const left=isCur?Math.max(dim-day+1,0):0;
 const before=spent(1,day-1);
 const bulkRest=isCur?bulkSum(day,dim):0;
 const allow=left>0?(budget-before-bulkRest)/left:0;
 const dow=(new Date(Y,M,Math.min(day,dim)).getDay()+6)%7;
 const ws=Math.max(1,day-dow),we=Math.min(dim,day+6-dow);
 return {key,hasIncome:hat,inc,budget,bud,tx,dim,isCur,isPast,day,left,allow,today:daily(day,day),
  before,total,bulkAll,spent,daily,bulkSum,ws,we,
  weekSpent:daily(ws,we),weekToDate:spent(ws,day),weekExpected:Math.round(budget*(day-ws+1)/dim),weekElapsed:day-ws+1,weekDays:we-ws+1,weekDaysLeft:Math.max(we-day+1,0),weekLimit:Math.max(Math.round((budget-bulkAll)/dim*(we-ws+1)),0),
  monthLeft:budget-total,pace:Math.round(budget*day/dim)-total};
}

function projected(ds,amtSen){
 const key=ds.slice(0,7);
 const hat=hasOwn(S.income,key);
 const inc=hat?(+S.income[key]||0):(+S.defInc||0);
 const budget=Math.max(sen(inc)-sen(S.aside),0);
 const dim=daysIn(+key.slice(0,4),+key.slice(5,7)-1);
 const dn=+ds.slice(8);
 const left=Math.max(dim-dn+1,1);
 const tx=S.tx.filter(t=>t.date.slice(0,7)===key&&t.id!==editId);
 const sum=arr=>arr.reduce((s,t)=>s+sen(t.amt),0);
 const before=sum(tx.filter(t=>+t.date.slice(8)<dn));
 const bulkRest=sum(tx.filter(t=>+t.date.slice(8)>=dn&&t.bulk));
 return {per:(budget-before-bulkRest-amtSen)/left,left};
}

function allowOn(D,extra){
 const dim=daysIn(Y,M);
 if(!(D>=1)||D>dim)return null;
 const key=ym();
 const hat=hasOwn(S.income,key);
 const inc=hat?(+S.income[key]||0):(+S.defInc||0);
 const budget=Math.max(sen(inc)-sen(S.aside),0);
 let before=0,bulkFrom=0;
 S.tx.forEach(t=>{
  if(t.date.slice(0,7)!==key||t.id===editId)return;
  const d=+t.date.slice(8);
  if(d<D)before+=sen(t.amt);
  else if(t.bulk)bulkFrom+=sen(t.amt);
 });
 if(extra){
  const ed=+extra.date.slice(8);
  if(ed<D)before+=extra.sen;
  else if(extra.bulk)bulkFrom+=extra.sen;
 }
 return (budget-before-bulkFrom)/(dim-D+1);
}

function tomorrowWith(ds,amtSen,isBulk){
 if(ym()!==keyOf(now.getFullYear(),now.getMonth()))return null;
 const D=now.getDate()+1;
 const ed=+ds.slice(8);
 if(ed!==now.getDate()&&ed!==D)return null;
 return allowOn(D,{date:ds,sen:amtSen,bulk:isBulk});
}

function txRow(t,withDate){
 const b=t.b||bucketOf(t.cat);
 const d=withDate?`<span class="txd">${new Date(t.date+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span> \u00b7 `:'';
 return `<div class="tx" data-a="edit" data-id="${esc(t.id)}" role="button" tabindex="0" aria-label="Edit ${esc(t.cat)} ${rmS(sen(t.amt))}">
  <span class="txl">${d}<span class="cat">${esc(t.cat)}</span>${t.note?' \u00b7 '+esc(t.note):''}</span>
  <span class="txr">${t.bulk?'<span class="bulk">BULK</span>':''}${rmS(sen(t.amt))}<button class="x" data-a="del" data-id="${esc(t.id)}" aria-label="Delete entry">\u2715</button></span></div>`;
}

function tmHTML(c){
 const tm=allowOn(c.day+1);
 if(tm===null)return `<div class="tmrow"><span>Tomorrow</span><b>new month</b></div>`;
 const over=tm<=0;
 return `<div class="tmrow ${over?'over':''}"><span>Tomorrow</span><b>${rmS(Math.max(tm,0))}</b></div>`;
}

function heroHTML(c){
 if(c.isPast){
  const q=c.budget>0?c.total/c.budget:0;
  return `<section class="panel hero ${c.total>c.budget?'over':''}">
   <div class="row"><span class="label">Spent in ${monthLabel()}</span><span class="chip">CLOSED</span></div>
   <div class="big">${rmS(c.total)}</div>
   <div class="bar ${q>1?'over':''}"><i style="width:${Math.min(Math.max(1-q,0)*100,100)}%"></i></div>
   <div class="kv"><span>OF ${rmS(c.budget)} BUDGET</span><span>${c.budget?Math.round(q*100):0}% USED</span></div></section>`;
 }
 if(!c.isCur){
  const per=c.dim?Math.round(c.budget/c.dim):0;
  return `<section class="panel hero">
   <div class="row"><span class="label">Daily allowance</span><span class="chip">${monthLabel()}</span></div>
   <div class="big">${rmS(per)}</div>
   <div class="kv"><span>BUDGET ${rmS(c.budget)}</span><span>${c.dim} DAYS</span></div></section>`;
 }
 const shown=Math.max(c.allow-c.today,0);
 const over=c.today>c.allow||(c.allow<=0&&c.today>0);
 const keep=c.allow>0?Math.max(c.allow-c.today,0)/c.allow:0;
 return `<section class="panel hero ${over?'over t-bad':(c.allow>0&&c.today/c.allow>=0.5?'t-warn':'t-good')}">
  <div class="row"><span class="label">You can spend today</span><span class="chip">${c.left} DAY${c.left===1?'':'S'} LEFT</span></div>
  <div class="big" id="hero" data-to="${shown}">${rmS(shown)}</div>
  <div class="bar ${over?'over':''}"><i style="width:${Math.round(keep*100)}%"></i></div>
  <div class="kv"><span>SPENT ${rmS(c.today)} / ${rmS(Math.max(c.allow,0))}</span><span>DAY ${c.day}/${c.dim}</span></div>
  ${tmHTML(c)}</section>`;
}

function bannerHTML(c){
 const p=new Date(Y,M-1,1),pk=keyOf(p.getFullYear(),p.getMonth());
 const last=hasOwn(S.income,pk)?+S.income[pk]||0:0;
 return `<section class="panel hero">
  <div class="row"><span class="label">No budget set</span><span class="chip">${monthLabel()}</span></div>
  <div class="big" style="color:#fff;font-size:34px;margin:14px 0 6px">SET INCOME</div>
  <div class="kv" style="margin-top:0"><span>SPENT SO FAR ${rmS(c.total)}</span><span>NO DAILY LIMIT</span></div>
  <div class="srow" style="margin-top:16px"><input id="binc" type="number" inputmode="decimal" min="0" placeholder="Income (RM)" aria-label="Income for this month"><button class="cta" data-a="bincok" style="width:auto;padding:0 18px;height:44px;letter-spacing:.14em">SET</button></div>
  ${last>0?`<button class="ghost" data-a="buselast" style="margin-top:10px;width:100%">USE LAST MONTH \u00b7 ${rmS(sen(last))}</button>`:''}
 </section>`;
}

function cardHTML(title,sp,lim,span){
 const rem=Math.max(lim-sp,0),keep=lim>0?(rem>0?rem/lim:1):0;
 return `<section class="panel ${span?'span':''} ${lim-sp<0?'t-bad':(lim>0&&sp/lim>=0.5?'t-warn':'t-neutral')}"><div class="label">${title}</div>
  <div class="num2">${rmS(lim-sp)}</div>
  <div class="bar ${lim-sp<0?'over':''}"><i style="width:${Math.round(keep*100)}%"></i></div>
  <div class="sub"><span>SPENT ${rmS(sp).replace('RM ','')}</span><span>OF ${rmS(lim).replace('RM ','')}</span></div></section>`;
}

function allocHTML(c){
 return ['n','w'].map((k,i)=>{
  const lim=c.bud[k],used=c.spent(1,c.dim,k),lef=lim-used,over=lef<0;
  const keep=lim>0?(over?1:Math.max(lef,0)/lim):0;
  return `<section class="panel ${over?'t-bad':(lim>0&&used/lim>=0.5?'t-warn':'t-neutral')}" data-a="bkt" data-b="${k}" role="button" tabindex="0" aria-label="${B[k]}, ${rmS(Math.abs(lef))} ${over?'over':'left'}">
   <div class="row"><span class="label"><i class="sq ${k==='w'?'w':''}"></i>${B[k]} ${S.split[i]}%</span><span class="aval ${over?'bad':''}">${rmS(lef)}</span></div>
   <div class="bar ${over?'over':''}" style="margin-top:12px"><i style="width:${(keep*100).toFixed(1)}%"></i></div>
   <div class="sub"><span>SPENT ${rmS(used)}</span><span>OF ${rmS(lim)}</span></div>
  </section>`;
 }).join('');
}

function horizon(days){
 if(!days||days<1)return '';
 if(days<14)return '~'+days+' day'+(days===1?'':'s');
 if(days<60){const w=Math.ceil(days/7);return '~'+w+' week'+(w===1?'':'s')}
 if(days<365){const m=Math.ceil(days/30);return '~'+m+' month'+(m===1?'':'s')}
 const y=Math.ceil(days/365);return '~'+y+' year'+(y===1?'':'s');
}
function planHTML(c){
 const under=Math.max(c.budget*c.day/c.dim-c.total,0);
 const dayB=c.dim>0?c.budget/c.dim:0;
 const target=sen(S.goal);
 const spct=target>0?Math.min(c.budget/target,1):0;
 const below=target>0&&c.budget<target;

 const items=S.wish.filter(w=>!w.done).map(w=>{
  const price=sen(w.price),gap=price-under,can=under>=price;
  const pct=price>0?Math.min(under/price,1):0;
  const days=(!can&&dayB>0)?Math.ceil(gap/dayB):0;
  return {w,price,gap,can,pct,days};
 }).sort((a,b)=>a.gap-b.gap);

 const rows=items.map(x=>{
  const id=esc(x.w.id);
  const tail=x.can
   ? '<span class="kv">Leaves '+rmS(under-x.price)+'</span><span class="wsub-r"><button class="wbuy" data-a="wbuy" data-id="'+id+'">Buy</button></span>'
   : '<span class="kv">'+rmS(x.gap)+' to go</span><span class="wsub-r"><span class="kv">'+horizon(x.days)+'</span></span>';
  return '<article class="wrow'+(x.can?' is-ready':'')+'">'
   +'<div class="wtop"><span class="wname">'+esc(x.w.name)+'</span><span class="wprice">'+rmS(x.price)+'</span></div>'
   +'<div class="wbar"><i style="width:'+(x.pct*100).toFixed(0)+'%"></i></div>'
   +'<div class="wsub">'+tail+'</div>'
   +'</article>';
 }).join('');

 const emptyBlock='<div class="wempty"><b>'+(S.wish.length?'All settled':'Nothing yet')+'</b><span>'
  +(S.wish.length?'Everything you queued has been bought.':'Add something you are saving for.')+'</span></div>';
 const frows=S.fixed.map(f=>'<div class="wrow">'
  +'<div class="wtop"><span class="wname">'+esc(f.name)+'</span><span class="wprice">'+rmS(sen(f.amt))+'</span><button class="x" data-a="fdel" data-id="'+f.id+'" aria-label="Remove '+esc(f.name)+'">✕</button></div>'
  +'<div class="wsub"><span class="miniTag">'+esc(f.cat||'—')+'</span><button class="wbuy" data-a="fbuy" data-id="'+f.id+'">BUY</button></div>'
  +'</div>').join('');

 return `<section class="panel">
   <div class="wlhead"><span class="wlpill"><i></i>Wishlist</span><span class="wlsum"><b>${rmS(under)}</b> spare</span><button class="plus" data-a="form" data-t="wish" aria-label="Add wishlist item">+</button></div>
   ${items.length?rows:emptyBlock}
  </section>
  <section class="panel">
   <div class="row"><span class="label">Fixed monthly</span><span class="rowend"><span class="chip">${S.fixed.length} ITEM${S.fixed.length===1?'':'S'}</span><button class="plus" data-a="form" data-t="fixed" aria-label="Add fixed item">+</button></span></div>
   ${S.fixed.length?frows:'<div class="sub" style="margin-top:12px">NOTHING YET</div>'}
  </section>
  <section class="panel ${below?'t-bad':'t-neutral'}">
   <div class="row"><span class="label">Savings</span><span class="rowend"><span class="chip">${target>0?rmS(target):'OFF'}</span><button class="plus" data-a="form" data-t="goal" aria-label="Set savings target">+</button></span></div>
   <div class="bar" style="margin-top:12px"><i style="width:${(spct*100).toFixed(0)}%"></i></div>
   <div class="kv"><span>BUDGET ${rmS(c.budget)}</span><span>${target>0?(below?'<b class="bad">BELOW TARGET</b>':'<b class="good">TARGET COVERED</b>'):'NO TARGET'}</span></div>
  </section>`;
}

function weekCardHTML(c){
 const exp=c.budget*c.day/c.dim,d=exp-c.total,over=d<0;
 const dayB=c.dim?c.budget/c.dim:0;
 const tone=over?'t-bad':(d<dayB?'t-warn':'t-good');
 const lbl=over?'OVER PACE':(d<dayB?'ON PACE':'UNDER PACE');
 const cls=over?'over':(d<dayB?'warn':'under');
 return `<section class="panel ${tone}"><div class="row"><span class="label">Pace this month</span></div>
  <div class="num2 ${over?'over':''}">${rmS(Math.abs(d))}</div>
  <div class="bar" style="background:transparent" aria-hidden="true"></div>
  <div class="sub" style="justify-content:flex-start"><span class="miniTag ${cls}">${lbl}</span></div></section>`;
}

function homeHTML(c){
 let h='';
 if(!c.hasIncome&&c.inc===0)h+=bannerHTML(c);
 else h+=heroHTML(c);
 if(c.isCur){
  h+=`<div class="duo">${weekCardHTML(c)}${cardHTML('Left this month',c.total,c.budget)}</div>`;
 }
 h+=allocHTML(c);
 h+=`<button class="cta" data-a="add" style="margin-top:2px">+ Add expense</button>`;
 h+=`<div class="foot"><span>${S.tx.length} entries</span><span>v7</span></div>`;
 return h;
}


function calHTML(c){
 const off=(new Date(Y,M,1).getDay()+6)%7;
 const base=c.dim?c.budget/c.dim:0;
 let cells='';
 for(let d=1;d<=c.dim;d++){
  const v=c.spent(d,d),bv=c.bulkSum(d,d),fut=c.isCur?d>c.day:new Date(Y,M,d)>now,tod=c.isCur&&d===c.day;
  const bulkDay=v>0&&bv/v>=0.5;
  const q=base>0?Math.min(v/base,1.2):0;
  let bg='';
  if(!fut&&!tod){
   if(v===0)bg='background:rgba(77,155,255,.06)';
   else{const a=(0.10+Math.min(q,1)*0.30).toFixed(2);
        const col=q>=1?'255,90,90':q>=0.5?'245,197,66':'74,222,128';
        bg='background:rgba('+col+','+a+')';}
  }
  cells+=`<div class="cd ${fut?'f':''} ${tod?'t':''}" data-a="day" data-d="${c.key}-${pad(d)}" role="button" tabindex="0" aria-label="Day ${d}${fut?', upcoming':v?', '+rmS(v)+' spent':', no spend'}" ${bg?'style="'+bg+'"':''}><span>${d}</span>${bulkDay?'<i class="bm"></i>':''}</div>`;
 }
 return `<section class="panel">
  <div class="row" style="margin-bottom:12px"><span class="label">${c.isCur?'This month':'Calendar'}</span><span class="chip">TAP A DAY TO LOG</span></div>
  <div class="cal">${'MTWTFSS'.split('').map(l=>`<div class="wk">${l}</div>`).join('')}${Array.from({length:off},()=>'<div class="cd e"></div>').join('')}${cells}</div>
  <div class="calnote"><span>UNDER HALF · HALF+ · AT BUDGET</span><span class="lg"><i class="bm"></i>MOSTLY BULK</span></div></section>`;
}

function weeksHTML(c){
 if(!c.tx.length)return '';
 const dayB=c.dim?c.budget/c.dim:0;
 let h='',a=1,n=1;
 while(a<=c.dim){
  if(c.isCur&&a>c.day)break;
  const dw=(new Date(Y,M,a).getDay()+6)%7,b=Math.min(a+6-dw,c.dim);
  const wt=c.tx.filter(t=>{const d=+t.date.slice(8);return d>=a&&d<=b});
  if(!wt.length){a=b+1;n++;continue;}
  const total=wt.reduce((s,t)=>s+sen(t.amt),0);
  const wb=dayB*(b-a+1);
  const ratio=wb>0?total/wb:0;
  const tone=ratio>=1?'t-bad':ratio>=0.5?'t-warn':'t-good';
  const isOpen=hasOwn(openW,'w'+n)?openW['w'+n]:(c.isCur&&c.day>=a&&c.day<=b);
  const days=Array.from(new Set(wt.map(t=>+t.date.slice(8)))).sort((x,y)=>x-y);
  h+=`<section class="panel ${tone}">
   <div class="row"><span class="label">Week ${n} · ${a}–${b}</span><span class="aval">${rmS(total)}</span></div>
   <details class="dt" data-k="w${n}" ${isOpen?'open':''} style="margin-top:10px">
    <summary><span>${days.length} day${days.length===1?'':'s'}</span><span>${wt.length} entr${wt.length===1?'y':'ies'}</span></summary>
    ${days.length?days.map(d=>{const dt=wt.filter(t=>+t.date.slice(8)===d);
      return `<div class="day"><div><span>${d} ${new Date(Y,M,d).toLocaleDateString('en-GB',{weekday:'short'})}</span><span>${rmS(dt.reduce((s,t)=>s+sen(t.amt),0))}</span></div>${dt.map(t=>txRow(t)).join('')}</div>`}).join(''):'<div class="sub" style="margin-top:8px">NO ENTRIES</div>'}
   </details>
  </section>`;
  a=b+1;n++;
 }
 return h;
}

function resultsHTML(){
 const term=q.trim().toLowerCase();
 const rows=S.tx.filter(t=>{
  if(fcat&&t.cat!==fcat)return false;
  if(!term)return true;
  return (t.cat+' '+t.note+' '+t.date).toLowerCase().includes(term);
 }).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
 return `<section class="panel"><div class="row" style="margin-bottom:6px"><span class="label">Results</span><span class="chip">${rows.length}</span></div>${rows.length?rows.map(t=>txRow(t,true)).join(''):'<div class="sub" style="margin-top:10px">NOTHING MATCHES</div>'}</section>`;
}

function histBody(c){
 if(q.trim()||fcat)return resultsHTML();
 return calHTML(c)+weeksHTML(c);
}

}

function render(){
 const c=calc();
 document.getElementById('mlabel').textContent=monthLabel().toUpperCase();
 document.getElementById('nav').style.display=view==='set'?'none':'flex';
 document.querySelectorAll('#tabs button').forEach(b=>{
  const active=b.dataset.v===view||(view==='bucket'&&b.dataset.v==='home');
  b.classList.toggle('on',active);b.setAttribute('aria-selected',active);
 });
 let h='';
 if(view==='home')h=homeHTML(c);
 else if(view==='plan')h=planHTML(c);
 else if(view==='hist')h=histHTML(c);
 else if(view==='bucket')h=bucketHTML(c);
 else h=setHTML(c);
 if(sheetOpen)h+=sheetHTML(c);
 if(formOpen)h+=formSheetHTML();
 const app=document.getElementById('app');
 app.innerHTML=h;
 app.className=dir>0?'inR':dir<0?'inL':'';
 dir=0;
 document.body.style.overflow=(sheetOpen||formOpen)?'hidden':'';
 if(sheetOpen){
  updateWhatif();
  setTimeout(()=>{const a=document.getElementById('amt');if(a){a.focus();if(a.select)a.select()}},30);
 }else if(view==='home'&&first){
  const hero=document.getElementById('hero');
  if(hero&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
   const to=+hero.dataset.to,t0=performance.now();
   (function step(t){const p=Math.min((t-t0)/700,1);hero.textContent=rmS(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
  }
 }
 first=false;
}

function showToast(msg,label,fn){
 const w=document.getElementById('toastwrap');
 w.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${label?`<button id="tact">${esc(label)}</button>`:''}</div>`;
 if(label){
  const b=document.getElementById('tact');
  if(b)b.onclick=()=>{w.innerHTML='';clearTimeout(toastTimer);if(fn)fn()};
 }
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>{w.innerHTML=''},label?6000:2600);
}

function go(v,d){
 view=v;dir=d;sheetOpen=false;editId=null;sheetDate=null;
 window.scrollTo(0,0);render();
}
function shiftMonth(n){
 const d=new Date(Y,M+n,1);Y=d.getFullYear();M=d.getMonth();openW={};render();
}
function openAdd(date,pf){
 sheetOpen=true;editId=null;formBulk=false;sheetDate=date||null;prefill=pf||null;if(pf&&pf.cat&&S.cats.some(c=>c.name===pf.cat))selCat=pf.cat;
 formBucket=((S.cats.find(c=>c.name===selCat)||{b:'n'}).b);
 if(!S.cats.some(c=>c.name===selCat))selCat=(S.cats[0]||{name:''}).name;
 render();
}
function openEdit(id){
 const t=S.tx.find(x=>x.id===id);if(!t)return;
 prefill=null;sheetOpen=true;editId=id;formBulk=!!t.bulk;sheetDate=t.date;selCat=t.cat;formBucket=t.b||bucketOf(t.cat);
 render();
}
function closeSheet(){sheetOpen=false;editId=null;sheetDate=null;prefill=null;render()}

function saveSheet(){
 const aEl=document.getElementById('amt'),dEl=document.getElementById('date'),nEl=document.getElementById('note');
 const amt=parseFloat(aEl.value),date=dEl.value,note=nEl.value.trim();
 if(!(amt>0)||!date){
  if(!(amt>0)){aEl.focus();if(aEl.select)aEl.select()}
  return;
 }
 const o={amt:Math.round(amt*100)/100,cat:selCat,date,note,bulk:formBulk,b:formBucket};
 let msg='Entry saved',newId=null,boughtWish=null;
 if(editId){
  const t=S.tx.find(x=>x.id===editId);
  if(t){Object.assign(t,o);msg='Entry updated'}
 }else{
  newId=uid();S.tx.push(Object.assign({id:newId},o));msg='Expense logged';
 }
 if(prefill&&prefill.wishId){const w=S.wish.find(x=>x.id===prefill.wishId);if(w){w.done=true;w.boughtOn=date;w.txId=newId;boughtWish=w;}}
 prefill=null;
 S.lastCat=selCat;
 save();
 const d=new Date(date+'T00:00');
 Y=d.getFullYear();M=d.getMonth();
 sheetOpen=false;editId=null;sheetDate=null;
 render();
 if(boughtWish){
  showToast(boughtWish.name+' bought','Undo',()=>{
   S.tx=S.tx.filter(t=>t.id!==boughtWish.txId);
   boughtWish.done=false;boughtWish.boughtOn=null;boughtWish.txId=null;
   save();render();
  });
 }else showToast(msg);
}

function delTx(id){
 const i=S.tx.findIndex(t=>t.id===id);
 if(i<0)return;
 const t=S.tx.splice(i,1)[0];
 save();render();
 showToast('Entry deleted','Undo',()=>{
  S.tx.splice(Math.min(i,S.tx.length),0,t);save();render();
 });
}


function updateWhatif(){
 const box=document.getElementById('whatif');
 if(!box)return;
 const aEl=document.getElementById('amt'),dEl=document.getElementById('date');
 const amt=parseFloat(aEl?aEl.value:'');
 const ds=(dEl&&dEl.value)||fmt(now);
 const parts=[];let bad=false;
 if(formBulk){
  parts.push('Bulk: left out of the daily number, spread across the month.');
 }else if(amt>0){
  const p=projected(ds,sen(amt));
  if(isFinite(p.per)){
   bad=p.per<0;
   parts.push(bad
    ?`More than what's left \u2014 ${rmS(-p.per)}/day over for ${p.left} day${p.left===1?'':'s'}.`
    :`Leaves ${rmS(p.per)}/day for ${p.left} day${p.left===1?'':'s'}.`);
  }
 }
 const tm=tomorrowWith(ds,amt>0?sen(amt):0,formBulk);
 if(tm===null&&ds.slice(0,7)===ym()&&+ds.slice(8)===now.getDate()&&now.getDate()===daysIn(now.getFullYear(),now.getMonth())){
  parts.push('Tomorrow starts a new month.');
 }else if(tm!==null){
  parts.push(`Tomorrow ${rmS(Math.max(tm,0))}.`);
  if(tm<0)bad=true;
 }
 box.textContent=parts.join(' ');
 box.className='whatif'+(bad?' bad':'');
}

function updateHistBody(){
 const hb=document.getElementById('hbody');
 if(hb)hb.innerHTML=histBody(calc());
}

function setIncomeNow(v){
 S.income[ym()]=Math.max(0,Math.round(v*100)/100);
 save();render();showToast('Income set for '+monthLabel());
}


function addCat(){
 const el=document.getElementById('ncat'),n=(el.value||'').trim(),b=document.getElementById('nbk').value;
 if(!n)return;
 if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase())){showToast('Category already exists');return}
 S.cats.push({name:n,b:b==='n'?'n':'w'});save();render();
}

function addPresets(){
 let n=0;
 PRESETS.forEach(([name,b])=>{
  if(!S.cats.some(c=>c.name.toLowerCase()===name.toLowerCase())){S.cats.push({name,b});n++}
 });
 if(n){save();render();showToast(n+' preset'+(n===1?'':'s')+' added')}
 else showToast('Presets already added');
}

function csvCell(v){
 const s=String(v==null?'':v);
 return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadCSV(name,rows){
 const body=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
 const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportCSV(month){
 try{
  const rows=[['date','category','bucket','amount','type','note']];
  S.tx.filter(t=>!month||t.date.slice(0,7)===month).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
   rows.push([t.date,t.cat,B[t.b||bucketOf(t.cat)],(Math.round(t.amt*100)/100).toFixed(2),t.bulk?'bulk':'daily',t.note]);
  });
  downloadCSV('ringgit-ledger-'+(month||fmt(now))+'.csv',rows);

  const wishes=(S.wish||[]).filter(w=>{
   const a=w.added?w.added.slice(0,7):'',b=w.boughtOn?w.boughtOn.slice(0,7):'';
   return !month||a===month||b===month;
  });
  if(wishes.length){
   const wrows=[['added','name','price','status','bought_on','days']];
   wishes.slice().sort((x,y)=>String(x.added).localeCompare(String(y.added))).forEach(w=>{
    const days=w.boughtOn?Math.max(0,Math.round((new Date(w.boughtOn+'T00:00')-new Date(w.added+'T00:00'))/864e5)):'';
    wrows.push([w.added,w.name,(Math.round(w.price*100)/100).toFixed(2),w.done?'bought':'open',w.boughtOn||'',days]);
   });
   setTimeout(()=>downloadCSV('ringgit-ledger-'+(month||fmt(now))+'-wishlist.csv',wrows),400);
  }
  showToast(month?'Month + wishlist exported':'CSV exported');
 }catch(e){showToast('Export failed here')}
}

async function copyJSON(month){
 const data=month?Object.assign({},S,{tx:S.tx.filter(t=>t.date.slice(0,7)===month)}):S;
 const txt=JSON.stringify(data);
 try{await navigator.clipboard.writeText(txt);showToast(month?'Month copied':'Full backup copied')}
 catch(e){showToast('Copy blocked \u2014 use CSV')}
}

async function copyBackup(){
 const t=JSON.stringify(S),ta=document.getElementById('bk');
 ta.value=t;ta.focus();ta.select();
 let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}
 catch(e){try{ok=document.execCommand('copy')}catch(_){}}
 document.getElementById('bkmsg').textContent=ok?'Copied. Paste it somewhere safe.':'Could not copy — select the text and copy it.';
}

function restoreBackup(){
 const ta=document.getElementById('bk');
 try{
  const o=JSON.parse(ta.value);
  if(!o||!Array.isArray(o.tx)||!Array.isArray(o.cats))throw new Error('shape');
  S=Object.assign(fresh(),o);
  norm();save();sheetOpen=false;restoreOpen=false;render();
  showToast('Backup restored');
 }catch(e){
  document.getElementById('bkmsg').textContent='Not a valid backup. Paste the full text.';
 }
}

function onAppClick(e){
 const el=e.target.closest('[data-a]');
 if(!el)return;
 const a=el.dataset.a;
 if(a==='chip'){
  const i=+el.dataset.i;
  if(!S.cats[i])return;
  selCat=S.cats[i].name;formBucket=S.cats[i].b;document.querySelectorAll('.seg [data-a="bucket"]').forEach(b=>b.classList.toggle('on',b.dataset.b===formBucket));
  document.querySelectorAll('.chip2').forEach(c=>{
   const on=c.dataset.i===String(i);
   c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);
  });
  return;
 }
 if(a==='bucket'){
  formBucket=el.dataset.b;
  document.querySelectorAll('.seg [data-a="bucket"]').forEach(b=>b.classList.toggle('on',b.dataset.b===formBucket));
  return;
 }
 if(a==='type'){
  formBulk=el.dataset.t==='bulk';
  document.querySelectorAll('.seg [data-a="type"]').forEach(b=>b.classList.toggle('on',(b.dataset.t==='bulk')===formBulk));
  updateWhatif();return;
 }
 if(a==='edit'){openEdit(el.dataset.id);return}
 if(a==='del'){delTx(el.dataset.id);return}
 if(a==='deledit'){const id=editId;sheetOpen=false;editId=null;if(id)delTx(id);return}
 if(a==='bkt'){bkt=el.dataset.b;go('bucket',1);return}
 if(a==='bback'){go('home',-1);return}
 if(a==='day'){openAdd(el.dataset.d);return}
 if(a==='add'){openAdd(null);return}
 if(a==='form'){formOpen=el.dataset.t;render();return}
 if(a==='fcancel'){formOpen=null;render();return}
 if(a==='fsave'){
  const amtEl=document.getElementById('f_amt'),num=amtEl?parseFloat(amtEl.value):NaN;
  if(formOpen==='goal'){
   if(isNaN(num)||num<0){showToast('Enter a target');return}
   S.goal=Math.round(num*100)/100;
  }else{
   const nameEl=document.getElementById('f_name'),name=nameEl?(nameEl.value||'').trim():'';
   if(!name||!(num>0)){showToast('Name and amount needed');return}
   if(formOpen==='wish')S.wish.push({id:uid(),name,price:Math.round(num*100)/100,added:fmt(now),done:false,boughtOn:null,txId:null});
   else S.fixed.push({id:uid(),name,amt:Math.round(num*100)/100,cat:(document.getElementById('f_cat')||{}).value||''});
  }
  formOpen=null;save();render();showToast('Saved');return;
 }
 if(a==='wdel'){S.wish=S.wish.filter(w=>w.id!==el.dataset.id);save();render();return}
 if(a==='fbuy'){
  const f=S.fixed.find(x=>x.id===el.dataset.id);if(!f)return;
  openAdd(null,{amt:f.amt,note:f.name,cat:f.cat});return;
 }
 if(a==='wbuy'){
  const w=S.wish.find(x=>x.id===el.dataset.id);if(!w)return;
  openAdd(null,{amt:w.price,note:w.name,wishId:w.id});return;
 }
 if(a==='save'){saveSheet();return}
 if(a==='cancel'){closeSheet();return}
 if(a==='back'){go('home',-1);return}
 if(a==='mprev'){shiftMonth(-1);return}
 if(a==='mnext'){shiftMonth(1);return}
 if(a==='fdel'){
  S.fixed=S.fixed.filter(f=>f.id!==el.dataset.id);save();render();showToast('Fixed cost removed');return;
 }
 if(a==='cadd'){addCat();return}
 if(a==='cdel'){
  const i=+el.dataset.i,cat=S.cats[i];
  if(!cat)return;
  if(S.cats.length<=1){showToast('Keep at least one category');return}
  const used=S.tx.filter(t=>t.cat===cat.name).length;
  if(used>0){showToast(`${cat.name} has ${used} entries \u2014 remove those first`);return}
  S.cats.splice(i,1);save();render();return;
 }
 if(a==='presets'){addPresets();return}
 if(a==='csv'){exportCSV();return}
 if(a==='copym'){copyJSON(el.dataset.m);return}
 if(a==='cpya'){copyJSON();return}
 if(a==='rstopen'){restoreOpen=true;render();return}
 if(a==='csvm'){exportCSV(el.dataset.m);return}
 if(a==='cpy'){copyBackup();return}
 if(a==='rst'){restoreBackup();return}
 if(a==='bincok'){
  const v=parseFloat(document.getElementById('binc').value);
  if(!(v>0)){showToast('Enter the income first');return}
  setIncomeNow(v);return;
 }
 if(a==='buselast'){
  const p=new Date(Y,M-1,1),pk=keyOf(p.getFullYear(),p.getMonth());
  if(hasOwn(S.income,pk))setIncomeNow(+S.income[pk]||0);
  return;
 }
}

function onAppChange(e){
 const t=e.target;
 if(t.id==='scat'){selCat=t.value;formBucket=(S.cats.find(c=>c.name===selCat)||{b:'n'}).b;const bs=document.getElementById('sbucket');if(bs)bs.value=formBucket;updateWhatif();return}
 if(t.id==='sbucket'){formBucket=t.value;return}
 if(t.id==='date'){sheetDate=t.value;updateWhatif();return}
 if(t.id==='inc'){
  const v=t.value.trim();
  if(v==='')delete S.income[ym()];
  else S.income[ym()]=Math.max(0,Math.round((parseFloat(v)||0)*100)/100);
  save();render();return;
 }
 if(t.id==='definc'){S.defInc=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.id==='aside'){S.aside=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.id==='goal'){S.goal=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.id==='fcatf'){fcat=t.value;updateHistBody();return}
 if(t.id==='fcat'||t.id==='fday'||t.id==='nbk')return;
 if(t.dataset.split!==undefined){S.split[+t.dataset.split]=Math.max(0,parseFloat(t.value)||0);save();render();return}
 if(t.dataset.cb!==undefined){S.cats[+t.dataset.cb].b=t.value==='n'?'n':'w';save();render();return}
}

const app=document.getElementById('app');
app.addEventListener('click',onAppClick);
app.addEventListener('change',onAppChange);
app.addEventListener('input',e=>{
 if(e.target.id==='q'){q=e.target.value;updateHistBody()}
 else if(e.target.id==='amt'){updateWhatif()}
});
app.addEventListener('toggle',e=>{
 const d=e.target;
 if(!d||d.tagName!=='DETAILS')return;
 if(d.dataset.k)openW[d.dataset.k]=d.open;
 else if(d.dataset.sk)openS[d.dataset.sk]=d.open;
},true);

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&(sheetOpen||formOpen)){e.preventDefault();if(sheetOpen)closeSheet();else{formOpen=null;render()}}
});
document.getElementById('logo').onclick=()=>go('home',-1);
document.getElementById('prev').onclick=()=>shiftMonth(-1);
document.getElementById('next').onclick=()=>shiftMonth(1);
[['tab-home','home',-1],['tab-plan','plan',1],['tab-hist','hist',1],['tab-set','set',1]].forEach(([id,v,d])=>{const el=document.getElementById(id);if(el)el.onclick=()=>go(v,d)});

let tx0=0,ty0=0,tOk=true;
document.addEventListener('touchstart',e=>{
 const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;
 tOk=!e.target.closest('input,textarea,select');
},{passive:true});
document.addEventListener('touchend',e=>{
 if(sheetOpen||!tOk)return;
 const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;
 if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
 if(view==='home'&&dx<0)go('hist',1);
 else if((view==='hist'||view==='bucket')&&dx>0)go('home',-1);
},{passive:true});

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
})();
</script></body></html>
